def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    ndkVersion "26.0.10792818"
    namespace 'com.dishii.soh'
    compileSdkVersion 31
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.dishii.soh"
        }
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 10
        versionName "9.0.2-ux2"
    }
    signingConfigs {
        // Optional fixed release key, so each new build installs over the previous one. Set
        // SOH_KEYSTORE_FILE, SOH_KEYSTORE_PASSWORD, SOH_KEY_ALIAS and SOH_KEY_PASSWORD (CI reads
        // them from repository secrets). Without them, builds use the per-machine debug key.
        release {
            def keystore = System.getenv("SOH_KEYSTORE_FILE")
            if (keystore != null && !keystore.isEmpty() && file(keystore).exists()) {
                storeFile file(keystore)
                storePassword System.getenv("SOH_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SOH_KEY_ALIAS")
                keyPassword System.getenv("SOH_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF",'-DUSE_OPENGLES=ON'
                    abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF",'-DUSE_OPENGLES=ON'
                    abiFilters 'arm64-v8a'
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
        variant.outputs.all { output ->
            def projectName = rootProject.name
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def versionCode = variant.versionCode

            def newApkName = "soh_${buildType}_v${versionName}.apk"
            outputFileName = newApkName
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //ndkBuild {
            //    path 'jni/Android.mk'
            //}
            cmake {
                 path '../../CMakeLists.txt'
                 version "3.31.5"
            }
        }
    }
    lintOptions {
        abortOnError false
    }
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

// The extractor needs ~7,700 small XML files on disk. Shipping them as loose APK
// assets made first-run setup copy them one by one (several minutes, no feedback).
// Pack them into a single zip plus a manifest so setup can stream-extract them
// with a real progress bar.
abstract class PackExtractorAssets extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getSourceDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void pack() {
        File src = sourceDir.get().asFile
        File out = outputDir.get().asFile
        out.mkdirs()
        File zipFile = new File(out, "extractor.zip")
        List<File> files = []
        src.eachFileRecurse(groovy.io.FileType.FILES) { files << it }
        files.sort { it.path }
        long totalBytes = 0
        new java.util.zip.ZipOutputStream(new FileOutputStream(zipFile)).withCloseable { zos ->
            files.each { File f ->
                String rel = src.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, (char) '/')
                def entry = new java.util.zip.ZipEntry("assets/" + rel)
                entry.time = 0L
                zos.putNextEntry(entry)
                f.withInputStream { zos << it }
                zos.closeEntry()
                totalBytes += f.length()
            }
        }
        new File(out, "extractor_manifest.txt").text = "${files.size()} ${totalBytes}\n"
    }
}

def packExtractorAssets = tasks.register("packExtractorAssets", PackExtractorAssets) {
    sourceDir = layout.projectDirectory.dir("src/main/extractor-assets")
    outputDir = layout.buildDirectory.dir("generated/extractorAssets")
}

androidComponents {
    onVariants(selector().all(), { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(packExtractorAssets, PackExtractorAssets::getOutputDir)
    })
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.7.0' // Use the latest version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

task wrapper(type: Wrapper) {
    gradleVersion = '8.10.2'
}

task prepareKotlinBuildScriptModel {
}
